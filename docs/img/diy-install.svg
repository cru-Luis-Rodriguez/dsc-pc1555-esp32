<svg viewBox="0 0 880 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Full hookup for this installation. Five zone loops — Front and Rear Door on GPIO 32, Master Bedroom on GPIO 33, 2nd Floor on GPIO 34, Rear Windows on GPIO 35, Front Windows on GPIO 36 — each pass through their own divider stage (5.6k pull-up, 15k to ground, 1k series into the pin, 0.1 microfarad to ground) into the ESP32's ADC1 pins. GPIO 39 is spare. The ESP32 is powered at VIN by 5 volts from the buck converter, and every loop and divider references the common ESP32 ground.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ink  { fill: #2b2f2e; }
    .dim  { fill: #6d7a76; }
  </style>
  <defs>
    <marker id="arri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b6ea5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="560" rx="8" fill="#f7f6f3" stroke="#d8d5cd"/>
  <text x="24" y="34" class="sans ink" font-size="16" font-weight="700">This install — five zone loops to ADC1</text>
  <text x="24" y="56" class="mono dim" font-size="10">one divider stage per zone — component values and expected voltages in the per-zone circuit diagram</text>

  <!-- column headers -->
  <text x="119" y="84" text-anchor="middle" class="mono dim" font-size="10">zone loop (contacts + EOL)</text>
  <text x="360" y="84" text-anchor="middle" class="mono dim" font-size="10">divider stage ×5</text>

  <!-- rows: y centers 122, 194, 266, 338, 410 -->
  <!-- row 1 -->
  <rect x="24" y="96" width="190" height="52" rx="4" fill="#fff" stroke="#2b2f2e" stroke-width="1.5"/>
  <text x="119" y="117" text-anchor="middle" class="sans ink" font-size="12" font-weight="700">Front/Rear Door</text>
  <text x="119" y="134" text-anchor="middle" class="mono dim" font-size="9.5">zone 1 · two contacts, one loop</text>
  <path d="M214,122 H256" fill="none" stroke="#2b2f2e" stroke-width="2"/>
  <rect x="256" y="96" width="208" height="52" rx="4" fill="#eeece7" stroke="#2b2f2e" stroke-width="1.5"/>
  <text x="360" y="117" text-anchor="middle" class="mono ink" font-size="10.5">5.6k↑ · 15k↓ · 1k→ · 0.1µF</text>
  <text x="360" y="134" text-anchor="middle" class="mono dim" font-size="9.5">node: 0 V short · 1.39 V ok · 2.40 V open</text>
  <path d="M464,122 H560" fill="none" stroke="#3b6ea5" stroke-width="2" marker-end="url(#arri)"/>

  <!-- row 2 -->
  <rect x="24" y="168" width="190" height="52" rx="4" fill="#fff" stroke="#2b2f2e" stroke-width="1.5"/>
  <text x="119" y="189" text-anchor="middle" class="sans ink" font-size="12" font-weight="700">Master Bedroom</text>
  <text x="119" y="206" text-anchor="middle" class="mono dim" font-size="9.5">zone 2</text>
  <path d="M214,194 H256" fill="none" stroke="#2b2f2e" stroke-width="2"/>
  <rect x="256" y="168" width="208" height="52" rx="4" fill="#eeece7" stroke="#2b2f2e" stroke-width="1.5"/>
  <text x="360" y="198" text-anchor="middle" class="mono ink" font-size="10.5">5.6k↑ · 15k↓ · 1k→ · 0.1µF</text>
  <path d="M464,194 H560" fill="none" stroke="#3b6ea5" stroke-width="2" marker-end="url(#arri)"/>

  <!-- row 3 -->
  <rect x="24" y="240" width="190" height="52" rx="4" fill="#fff" stroke="#2b2f2e" stroke-width="1.5"/>
  <text x="119" y="261" text-anchor="middle" class="sans ink" font-size="12" font-weight="700">2nd Floor</text>
  <text x="119" y="278" text-anchor="middle" class="mono dim" font-size="9.5">zone 3</text>
  <path d="M214,266 H256" fill="none" stroke="#2b2f2e" stroke-width="2"/>
  <rect x="256" y="240" width="208" height="52" rx="4" fill="#eeece7" stroke="#2b2f2e" stroke-width="1.5"/>
  <text x="360" y="270" text-anchor="middle" class="mono ink" font-size="10.5">5.6k↑ · 15k↓ · 1k→ · 0.1µF</text>
  <path d="M464,266 H560" fill="none" stroke="#3b6ea5" stroke-width="2" marker-end="url(#arri)"/>

  <!-- row 4 -->
  <rect x="24" y="312" width="190" height="52" rx="4" fill="#fff" stroke="#2b2f2e" stroke-width="1.5"/>
  <text x="119" y="333" text-anchor="middle" class="sans ink" font-size="12" font-weight="700">Rear Windows</text>
  <text x="119" y="350" text-anchor="middle" class="mono dim" font-size="9.5">zone 4</text>
  <path d="M214,338 H256" fill="none" stroke="#2b2f2e" stroke-width="2"/>
  <rect x="256" y="312" width="208" height="52" rx="4" fill="#eeece7" stroke="#2b2f2e" stroke-width="1.5"/>
  <text x="360" y="342" text-anchor="middle" class="mono ink" font-size="10.5">5.6k↑ · 15k↓ · 1k→ · 0.1µF</text>
  <path d="M464,338 H560" fill="none" stroke="#3b6ea5" stroke-width="2" marker-end="url(#arri)"/>

  <!-- row 5 -->
  <rect x="24" y="384" width="190" height="52" rx="4" fill="#fff" stroke="#2b2f2e" stroke-width="1.5"/>
  <text x="119" y="405" text-anchor="middle" class="sans ink" font-size="12" font-weight="700">Front Windows</text>
  <text x="119" y="422" text-anchor="middle" class="mono dim" font-size="9.5">zone 5</text>
  <path d="M214,410 H256" fill="none" stroke="#2b2f2e" stroke-width="2"/>
  <rect x="256" y="384" width="208" height="52" rx="4" fill="#eeece7" stroke="#2b2f2e" stroke-width="1.5"/>
  <text x="360" y="414" text-anchor="middle" class="mono ink" font-size="10.5">5.6k↑ · 15k↓ · 1k→ · 0.1µF</text>
  <path d="M464,410 H560" fill="none" stroke="#3b6ea5" stroke-width="2" marker-end="url(#arri)"/>

  <!-- ESP32 -->
  <rect x="564" y="88" width="292" height="360" rx="4" fill="#eeece7" stroke="#2b2f2e" stroke-width="2"/>
  <text x="710" y="72" text-anchor="middle" class="sans ink" font-size="14" font-weight="700">ESP32-WROOM</text>
  <text x="576" y="127" class="mono" font-size="11.5" font-weight="600" fill="#3b6ea5">GPIO 32</text>
  <text x="576" y="199" class="mono" font-size="11.5" font-weight="600" fill="#3b6ea5">GPIO 33</text>
  <text x="576" y="271" class="mono" font-size="11.5" font-weight="600" fill="#3b6ea5">GPIO 34</text>
  <text x="576" y="343" class="mono" font-size="11.5" font-weight="600" fill="#3b6ea5">GPIO 35</text>
  <text x="576" y="415" class="mono" font-size="11.5" font-weight="600" fill="#3b6ea5">GPIO 36</text>
  <text x="656" y="127" class="mono dim" font-size="9.5">ADC1</text>
  <text x="656" y="199" class="mono dim" font-size="9.5">ADC1</text>
  <text x="656" y="271" class="mono dim" font-size="9.5">ADC1 · input-only</text>
  <text x="656" y="343" class="mono dim" font-size="9.5">ADC1 · input-only</text>
  <text x="656" y="415" class="mono dim" font-size="9.5">ADC1 · SENSOR_VP</text>
  <text x="576" y="440" class="mono dim" font-size="9.5">GPIO 39 spare · GPIO 26 relay (phase 2)</text>
  <text x="740" y="127" class="mono ink" font-size="10">VIN ◄ 5.0 V buck</text>
  <text x="740" y="147" class="mono ink" font-size="10" font-weight="600">GND ◄ common</text>

  <!-- ground rail -->
  <path d="M119,436 V500 H710 V448" fill="none" stroke="#2b2f2e" stroke-width="2.5"/>
  <path d="M360,436 V500" fill="none" stroke="#2b2f2e" stroke-width="2"/>
  <path d="M101,500 H137 M107,507 H131 M113,514 H125" fill="none" stroke="#2b2f2e" stroke-width="2"/>
  <text x="150" y="524" class="mono dim" font-size="10">every loop, every divider 15k/0.1µF leg, and the ESP32 share one ground</text>

  <!-- wifi note -->
  <text x="150" y="544" class="mono" font-size="10" fill="#e08a2e" font-weight="600">GPIO 36 needs WiFi.setSleep(false) — power-save glitches SENSOR_VP/VN reads</text>
</svg>
