<svg viewBox="0 0 880 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Power tree for this installation. The retired PC1555 panel, fed by its 16.5 volt AC transformer and charging the CA1240 battery, acts as a battery-backed power supply. AUX plus feeds the LM2596 buck converter set to 5 volts, which feeds the ESP32 VIN. The optional phase-2 siren is fed from the battery positive terminal through a 1 amp inline fuse to the relay common contact; the relay's normally-open contact switches 12 volts to the siren, with the relay input driven by GPIO 26. All grounds — AUX minus, battery minus, buck minus, ESP32 GND, siren minus — are common.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ink  { fill: #2b2f2e; }
    .dim  { fill: #6d7a76; }
  </style>
  <defs>
    <marker id="arrq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2f2e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="560" rx="8" fill="#f7f6f3" stroke="#d8d5cd"/>
  <text x="24" y="34" class="sans ink" font-size="16" font-weight="700">This install — power from the retired panel</text>
  <text x="24" y="56" class="mono dim" font-size="10">the CPU is dead; the 13.6 V supply and battery charger are proven good — the panel is now a battery-backed PSU</text>

  <!-- transformer -->
  <rect x="24" y="90" width="120" height="60" rx="4" fill="#eeece7" stroke="#2b2f2e" stroke-width="1.5"/>
  <text x="84" y="115" text-anchor="middle" class="sans ink" font-size="12" font-weight="700">transformer</text>
  <text x="84" y="132" text-anchor="middle" class="mono dim" font-size="10">16.5 VAC</text>
  <path d="M144,120 H196" fill="none" stroke="#2b2f2e" stroke-width="2" marker-end="url(#arrq)"/>

  <!-- panel -->
  <rect x="200" y="76" width="200" height="180" rx="4" fill="#eeece7" stroke="#2b2f2e" stroke-width="2"/>
  <text x="300" y="102" text-anchor="middle" class="sans ink" font-size="14" font-weight="700">PC1555 (retired)</text>
  <text x="300" y="120" text-anchor="middle" class="mono dim" font-size="10">supply + charger only</text>
  <circle cx="400" cy="150" r="5" fill="#c0392b"/>
  <text x="388" y="142" text-anchor="end" class="mono ink" font-size="11" font-weight="600">AUX+</text>
  <circle cx="400" cy="230" r="5" fill="#2b2f2e"/>
  <text x="388" y="234" text-anchor="end" class="mono ink" font-size="11" font-weight="600">AUX−</text>
  <text x="212" y="200" class="mono dim" font-size="10">battery leads ↓</text>

  <!-- battery -->
  <rect x="200" y="300" width="200" height="70" rx="4" fill="#fff" stroke="#2b2f2e" stroke-width="1.5"/>
  <text x="300" y="326" text-anchor="middle" class="sans ink" font-size="12" font-weight="700">CA1240 battery</text>
  <text x="300" y="344" text-anchor="middle" class="mono dim" font-size="10">12 V 4 Ah · charged by the panel</text>
  <path d="M260,256 V300" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <path d="M340,256 V300" fill="none" stroke="#2b2f2e" stroke-width="2.5"/>
  <circle cx="400" cy="330" r="5" fill="#c0392b"/>
  <text x="388" y="322" text-anchor="end" class="mono" font-size="10" font-weight="600" fill="#c0392b">BAT+</text>

  <!-- AUX+ to buck -->
  <path d="M405,150 H470" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="412" y="142" class="mono" font-size="10" font-weight="600" fill="#c0392b">13.6 V</text>
  <rect x="470" y="120" width="184" height="66" rx="4" fill="#fff" stroke="#2b2f2e" stroke-width="1.5"/>
  <text x="562" y="144" text-anchor="middle" class="sans ink" font-size="12" font-weight="700">LM2596 buck</text>
  <text x="562" y="162" text-anchor="middle" class="mono" font-size="10" fill="#e08a2e" font-weight="600">set OUT to 5.0 V first</text>
  <path d="M654,150 H700" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrq)"/>
  <text x="662" y="142" class="mono" font-size="10" font-weight="600" fill="#c0392b">5.0 V</text>

  <!-- ESP32 -->
  <rect x="704" y="100" width="152" height="160" rx="4" fill="#eeece7" stroke="#2b2f2e" stroke-width="2"/>
  <text x="780" y="132" text-anchor="middle" class="sans ink" font-size="15" font-weight="700">ESP32</text>
  <text x="714" y="158" class="mono ink" font-size="11" font-weight="600">5V / VIN</text>
  <text x="714" y="186" class="mono" font-size="10.5" font-weight="600" fill="#3b6ea5">GPIO 26 → relay IN</text>
  <text x="714" y="210" class="mono ink" font-size="10.5">5V → relay VCC</text>
  <text x="714" y="238" class="mono ink" font-size="11" font-weight="600">GND</text>

  <!-- phase 2 cluster -->
  <rect x="452" y="300" width="404" height="180" rx="6" fill="none" stroke="#6d7a76" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="464" y="320" class="mono dim" font-size="10">phase 2 — optional siren</text>

  <!-- BAT+ through fuse to relay COM -->
  <path d="M405,330 H452" fill="none" stroke="#c0392b" stroke-width="2.5" transform="translate(0,26)"/>
  <path d="M405,330 V356" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="452" y="340" width="92" height="34" rx="4" fill="#fff" stroke="#2b2f2e" stroke-width="1.5"/>
  <text x="498" y="361" text-anchor="middle" class="mono ink" font-size="10.5" font-weight="600">fuse 1 A</text>
  <path d="M544,357 H584" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="444" y="394" class="mono dim" font-size="9">siren draw exceeds</text>
  <text x="444" y="406" class="mono dim" font-size="9">AUX rating — feed it</text>
  <text x="444" y="418" class="mono dim" font-size="9">from BAT+, never AUX</text>

  <!-- relay -->
  <rect x="584" y="330" width="150" height="96" rx="4" fill="#fff" stroke="#2b2f2e" stroke-width="1.5"/>
  <text x="659" y="350" text-anchor="middle" class="sans ink" font-size="11.5" font-weight="700">relay module</text>
  <text x="594" y="370" class="mono ink" font-size="10">COM</text>
  <text x="594" y="390" class="mono ink" font-size="10">NO</text>
  <text x="724" y="370" text-anchor="end" class="mono" font-size="10" fill="#3b6ea5">IN</text>
  <text x="724" y="390" text-anchor="end" class="mono ink" font-size="10">VCC</text>
  <text x="724" y="410" text-anchor="end" class="mono ink" font-size="10">GND</text>

  <!-- control wires from ESP32 down to relay right edge -->
  <path d="M756,260 V330" fill="none" stroke="#3b6ea5" stroke-width="2" transform="translate(-20,0)"/>
  <path d="M760,260 V318 H744 V330" fill="none" stroke="#2b2f2e" stroke-width="2" transform="translate(8,0)"/>

  <!-- NO to siren -->
  <path d="M594,386 H566 V446 H600" fill="none" stroke="#e08a2e" stroke-width="2.5" marker-end="url(#arrq)"/>
  <rect x="604" y="426" width="120" height="44" rx="4" fill="#fff" stroke="#2b2f2e" stroke-width="1.5"/>
  <text x="664" y="444" text-anchor="middle" class="sans ink" font-size="11.5" font-weight="700">siren</text>
  <text x="664" y="460" text-anchor="middle" class="mono dim" font-size="9.5">0.5–1 A at 12 V</text>

  <!-- ground bus -->
  <path d="M405,230 H430 V516 H770" fill="none" stroke="#2b2f2e" stroke-width="2.5"/>
  <path d="M340,370 V516" fill="none" stroke="#2b2f2e" stroke-width="2.5" transform="translate(0,0)"/>
  <path d="M724,470 V516" fill="none" stroke="#2b2f2e" stroke-width="2" transform="translate(-60,0)"/>
  <circle cx="770" cy="516" r="4.5" fill="#2b2f2e"/>
  <path d="M770,516 V492" fill="none" stroke="#2b2f2e" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="782" y="520" class="mono dim" font-size="10">ESP32 GND</text>
  <path d="M120,516 H430" fill="none" stroke="#2b2f2e" stroke-width="2.5"/>
  <path d="M102,516 H138 M108,523 H132 M114,530 H126" fill="none" stroke="#2b2f2e" stroke-width="2"/>
  <text x="150" y="540" class="mono dim" font-size="10">one common ground: AUX− · BAT− · buck − · ESP32 GND · siren − — not optional</text>
</svg>
