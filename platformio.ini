; DSC zone reader — ESP32 reads the zone loops directly.
;
; The PC1555 was retired 2026-09-14 (docs/panel-bringup.md → "Final test
; session": the CPU does not execute firmware). The active targets now sense
; the zone loops themselves, per docs/diy-zone-reader.md:
;
;   pio run -e serial -t upload -t monitor   → zone status over serial
;   pio run -e web    -t upload -t monitor   → standalone LAN web page
;
; Retired Keybus targets, kept buildable for reference:
;   -e reader        → RAW Keybus dump          -e keybus-serial → old serial
;   -e probe         → raw edge counter         -e keybus-web    → old web page
;   -e peak          → ADC peak on the clock tap
;
; IMPORTANT: platform is pinned to espressif32 6.x on purpose.
; That series ships arduino-esp32 2.0.x. dscKeybusInterface (still used by the
; reference envs) does NOT compile against arduino-esp32 3.x — the timer API
; changed (timerBegin() signature, timerAlarmEnable/Disable removed). See
; taligentx/dscKeybusInterface#344. Do not bump to espressif32@^7.

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps =
    dscKeybusInterface@^3.0.0

[env:probe]
build_src_filter = +<pin_probe.cpp>

[env:peak]
build_src_filter = +<adc_peak.cpp>

[env:reader]
build_src_filter = +<keybus_reader.cpp>

[env:serial]
build_src_filter = +<zone_serial.cpp> +<zones.cpp>

[env:web]
build_src_filter = +<zone_web.cpp> +<zones.cpp>

; --- retired Keybus versions, for reference ---

[env:keybus-serial]
build_src_filter = +<status_serial.cpp>

[env:keybus-web]
build_src_filter = +<web_status.cpp>
